name: dev_ubiquiti_worktime_monitor
services:
    postgres:
        container_name: postgres_ubiquiti_worktime_monitor
        image: postgres:latest
        environment:
            POSTGRES_USER: ${DEV_POSTGRES_USER:?error - Set DEV_POSTGRES_USER in .env}
            POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?error - Set DEV_POSTGRES_PASSWORD in .env}
        ports:
            - '${DEV_POSTGRES_PORT:?error - Set DEV_POSTGRES_PORT in .env}:5432'
        volumes:
            - ./postgres:/var/lib/postgresql

    pgadmin:
        container_name: pgadmin_ubiquiti_worktime_monitor
        image: dpage/pgadmin4
        environment:
            PGADMIN_DEFAULT_EMAIL: ${DEV_PGADMIN_USER_EMAIL:?error - Set DEV_PGADMIN_USER_EMAIL in .env}
            PGADMIN_DEFAULT_PASSWORD: ${DEV_PGADMIN_USER_PASSWORD:?error - Set DEV_PGADMIN_USER_PASSWORD in .env}
        volumes:
            - ./pgadmin:/var/lib/pgadmin
        ports:
            - '${DEV_PGADMIN_PORT:?error - Set DEV_PGADMIN_PORT in .env}:80'
        depends_on:
            - postgres
